<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="100%" height="100%">
  <!-- Shizuka, Nobita & Gian peeking in, curious about the password -->

  <!-- ===================== SHIZUKA ===================== -->
  <g id="shizuka" class="friend-figure">
    <!-- Waving arm -->
    <ellipse cx="46" cy="108" rx="8" ry="20" fill="#fbcfe8" stroke="#0f172a" stroke-width="2" transform="rotate(-35 46 108)"/>
    <circle cx="36" cy="92" r="8" fill="#ffe4c4" stroke="#0f172a" stroke-width="2"/>
    <!-- Body / dress -->
    <path d="M 46 140 Q 40 175 36 205 L 92 205 Q 88 175 82 140 Z" fill="#f472b6" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Head -->
    <circle cx="64" cy="118" r="30" fill="#ffe4c4" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Hair (bob + headband) -->
    <path d="M 34 118 Q 30 82 64 80 Q 98 82 94 118 Q 94 100 64 98 Q 34 100 34 118 Z" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <rect x="36" y="92" width="56" height="8" rx="4" fill="#ef4444" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Face -->
    <circle cx="54" cy="120" r="3.5" fill="#0f172a"/>
    <circle cx="74" cy="120" r="3.5" fill="#0f172a"/>
    <path d="M 58 132 Q 64 137 70 132" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="48" cy="126" r="4" fill="#fda4af" opacity="0.6"/>
    <circle cx="80" cy="126" r="4" fill="#fda4af" opacity="0.6"/>
    <!-- Other arm down -->
    <ellipse cx="86" cy="150" rx="8" ry="20" fill="#fbcfe8" stroke="#0f172a" stroke-width="2"/>
    <!-- Shoes -->
    <ellipse cx="48" cy="208" rx="12" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="80" cy="208" rx="12" ry="7" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- ===================== NOBITA ===================== -->
  <g id="nobita" class="friend-figure" transform="translate(105 4)">
    <!-- Body / shirt -->
    <path d="M 40 138 Q 34 175 30 202 L 90 202 Q 86 175 80 138 Z" fill="#fde047" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Arms down -->
    <ellipse cx="30" cy="152" rx="8" ry="20" fill="#fde047" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="90" cy="152" rx="8" ry="20" fill="#fde047" stroke="#0f172a" stroke-width="2"/>
    <circle cx="27" cy="174" r="7" fill="#ffe4c4" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="93" cy="174" r="7" fill="#ffe4c4" stroke="#0f172a" stroke-width="1.8"/>
    <!-- Head -->
    <circle cx="60" cy="118" r="30" fill="#ffe4c4" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Hair -->
    <path d="M 30 112 Q 28 78 60 78 Q 92 78 90 112 Q 78 96 60 98 Q 42 96 30 112 Z" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <path d="M 56 78 L 52 68" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Round glasses -->
    <circle cx="49" cy="120" r="11" fill="#ffffff" fill-opacity="0.5" stroke="#0f172a" stroke-width="2.2"/>
    <circle cx="71" cy="120" r="11" fill="#ffffff" fill-opacity="0.5" stroke="#0f172a" stroke-width="2.2"/>
    <line x1="60" y1="120" x2="60" y2="120" stroke="#0f172a" stroke-width="2"/>
    <line x1="60" y1="118" x2="65" y2="116" stroke="#0f172a" stroke-width="2"/>
    <circle cx="49" cy="120" r="3" fill="#0f172a"/>
    <circle cx="71" cy="120" r="3" fill="#0f172a"/>
    <!-- Mouth -->
    <path d="M 52 136 Q 60 141 68 136" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="42" cy="205" rx="12" ry="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="78" cy="205" rx="12" ry="7" fill="#38bdf8" stroke="#0f172a" stroke-width="2"/>
  </g>

  <!-- ===================== GIAN ===================== -->
  <g id="gian" class="friend-figure" transform="translate(190 -8)">
    <!-- Waving arm -->
    <ellipse cx="98" cy="118" rx="9" ry="22" fill="#fb923c" stroke="#0f172a" stroke-width="2" transform="rotate(35 98 118)"/>
    <circle cx="106" cy="100" r="8" fill="#ffd8ae" stroke="#0f172a" stroke-width="2"/>
    <!-- Body / striped shirt -->
    <path d="M 32 150 Q 26 186 22 214 L 96 214 Q 92 186 86 150 Z" fill="#fb923c" stroke="#0f172a" stroke-width="2.5"/>
    <path d="M 24 172 L 90 172" stroke="#ffffff" stroke-width="6"/>
    <path d="M 22 194 L 94 194" stroke="#ffffff" stroke-width="6"/>
    <!-- Other arm down -->
    <ellipse cx="24" cy="164" rx="9" ry="22" fill="#fb923c" stroke="#0f172a" stroke-width="2"/>
    <!-- Head (bigger, sturdy) -->
    <circle cx="59" cy="126" r="34" fill="#ffd8ae" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Buzzcut hair -->
    <path d="M 28 122 Q 26 90 59 88 Q 92 90 90 122 Q 78 106 59 108 Q 40 106 28 122 Z" fill="#1f2937" stroke="#0f172a" stroke-width="2"/>
    <!-- Face -->
    <circle cx="48" cy="130" r="3.5" fill="#0f172a"/>
    <circle cx="70" cy="130" r="3.5" fill="#0f172a"/>
    <path d="M 42 96 L 34 90" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 76 96 L 84 90" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <path d="M 46 146 Q 59 156 72 146" stroke="#0f172a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="38" cy="217" rx="13" ry="7" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
    <ellipse cx="80" cy="217" rx="13" ry="7" fill="#0284c7" stroke="#0f172a" stroke-width="2"/>
  </g>
</svg>
