<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <!-- Doraemon with Gift Box & Bamboo Copter -->
  <defs>
    <radialGradient id="doraemonBlue" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <radialGradient id="bellGold" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <linearGradient id="giftBoxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
  </defs>

  <!-- Bamboo-copter (Take-copter) on head -->
  <g id="take-copter" class="spin-copter">
    <rect x="96" y="8" width="8" height="18" fill="#eab308" rx="3"/>
    <ellipse cx="100" cy="8" rx="36" ry="4" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  </g>

  <!-- Doraemon Head -->
  <circle cx="100" cy="80" r="56" fill="url(#doraemonBlue)" stroke="#0f172a" stroke-width="3"/>
  <!-- White Face Mask -->
  <ellipse cx="100" cy="88" rx="44" ry="40" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Eyes -->
  <ellipse cx="88" cy="58" rx="12" ry="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <ellipse cx="112" cy="58" rx="12" ry="16" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Pupils (Happy looking down at gift) -->
  <ellipse cx="91" cy="62" rx="4.5" ry="6" fill="#0f172a"/>
  <circle cx="93" cy="60" r="1.5" fill="#ffffff"/>
  <ellipse cx="109" cy="62" rx="4.5" ry="6" fill="#0f172a"/>
  <circle cx="111" cy="60" r="1.5" fill="#ffffff"/>

  <!-- Red Nose -->
  <circle cx="100" cy="74" r="8" fill="#ef4444" stroke="#0f172a" stroke-width="2"/>
  <circle cx="98" cy="72" r="2.5" fill="#ffffff"/>
  <!-- Nose Line -->
  <line x1="100" y1="82" x2="100" y2="104" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Big Happy Mouth -->
  <path d="M 68 96 Q 100 132 132 96" fill="#dc2626" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Tongue -->
  <path d="M 82 108 Q 100 98 118 108 Q 100 128 82 108" fill="#fb7185"/>

  <!-- Whiskers -->
  <line x1="62" y1="80" x2="36" y2="76" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="88" x2="32" y2="88" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="96" x2="36" y2="100" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="80" x2="164" y2="76" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="140" y1="88" x2="168" y2="88" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="138" y1="96" x2="164" y2="100" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Red Collar -->
  <rect x="66" y="126" width="68" height="12" fill="#ef4444" stroke="#0f172a" stroke-width="2.5" rx="5"/>
  <!-- Bell -->
  <circle cx="100" cy="140" r="10" fill="url(#bellGold)" stroke="#0f172a" stroke-width="2"/>
  <line x1="93" y1="137" x2="107" y2="137" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="100" cy="142" r="2.5" fill="#0f172a"/>
  <line x1="100" y1="144.5" x2="100" y2="149" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Body -->
  <path d="M 68 136 L 56 195 Q 100 205 144 195 L 132 136 Z" fill="url(#doraemonBlue)" stroke="#0f172a" stroke-width="2.5"/>
  <!-- White Belly -->
  <ellipse cx="100" cy="168" rx="28" ry="24" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- Feet -->
  <ellipse cx="78" cy="204" rx="20" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>
  <ellipse cx="122" cy="204" rx="20" ry="12" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Hands Holding Gift Box -->
  <circle cx="58" cy="164" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="142" cy="164" r="12" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>

  <!-- Wrapped Birthday Gift Box -->
  <g id="gift-box">
    <rect x="74" y="148" width="52" height="42" fill="url(#giftBoxGrad)" stroke="#0f172a" stroke-width="2" rx="4"/>
    <!-- Yellow Ribbon -->
    <rect x="96" y="148" width="8" height="42" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <rect x="74" y="165" width="52" height="8" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <!-- Ribbon Bow -->
    <ellipse cx="94" cy="144" rx="7" ry="5" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <ellipse cx="106" cy="144" rx="7" ry="5" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
    <circle cx="100" cy="145" r="3.5" fill="#eab308"/>
  </g>
</svg>
