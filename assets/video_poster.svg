<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050714"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="340" fill="url(#glow)"/>

  <!-- Play Circle Icon -->
  <circle cx="640" cy="330" r="64" fill="#ec4899" fill-opacity="0.85" stroke="#fef08a" stroke-width="4"/>
  <polygon points="625,300 670,330 625,360" fill="#ffffff"/>

  <!-- Title Text -->
  <text x="640" y="450" font-family="'Outfit', sans-serif" font-size="38" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
    A Special Birthday Video Message For Suggu ❤️
  </text>
  <text x="640" y="495" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" fill="#cbd5e1" text-anchor="middle">
    Drop your video file into assets/birthday_video.mp4 to play here!
  </text>
</svg>
